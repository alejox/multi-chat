<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat · espectadores</title>
<!-- La fuente "Multichat (espectadores)" carga esta página y le manda con el evento
     "multichat" (javascript_event de obs-browser):
       {type: "config", config: {...}} · {type: "viewers", sources: [{platform, channel, live, viewers}]} -->
<style>
  :root { --fs: 28px; --bg-alpha: .6; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: #fff; font: 700 var(--fs)/1.2 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
    text-shadow: 0 0 2px #000, 0 1px 3px #000c, 0 0 6px #0008; font-variant-numeric: tabular-nums; }
  #box { position: absolute; top: 0; left: 0; display: inline-flex; align-items: center; gap: .3em .9em;
    padding: .35em .6em; border-radius: .45em; transition: opacity .4s; }
  body.column #box { flex-direction: column; align-items: flex-start; }
  body.bg #box { background: rgba(0, 0, 0, var(--bg-alpha)); text-shadow: none; }
  body.empty #box { opacity: 0; }
  .item { display: inline-flex; align-items: center; gap: .35em; white-space: nowrap; }
  .pf { display: inline-block; filter: drop-shadow(0 1px 2px #000a); }
  .pf svg { width: 1.1em; height: 1.1em; display: block; }
  .name { font-weight: 600; font-size: .6em; opacity: .85; }
  .total { padding-left: .9em; border-left: 2px solid #fff5; }
  body.column .total { padding: .25em 0 0; border-left: 0; border-top: 2px solid #fff5; align-self: stretch; }
  .eye { width: 1.1em; height: 1.1em; }
  .nonames .name { display: none; }
</style>
</head>
<body class="empty">
<div id="box"></div>
<script src="icons.js"></script>
<script>
const EYE = '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.3" fill="#fff"/></svg>';

let config = { size: 28, layout: 'row', total: true, names: false, background: true, opacity: 60,
  platforms: ['twitch', 'youtube', 'kick', 'tiktok'], preview: true, streaming: false };
let sources = [];
const box = document.getElementById('box');
const compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
const plain = new Intl.NumberFormat();

function format(n) {
  if (n < 0) return '—';
  return n < 10000 ? plain.format(n) : compact.format(n);
}

// Para colocar la fuente sin estar en directo.
const SAMPLE = [
  { platform: 'twitch', channel: 'micanal', live: 1, viewers: 1234 },
  { platform: 'youtube', channel: '@micanal', live: 1, viewers: 856 },
  { platform: 'kick', channel: 'micanal', live: 1, viewers: 312 },
  { platform: 'tiktok', channel: '@micanal', live: 1, viewers: 2045 },
];

// Los números cambian con una pequeña animación en lugar de saltar.
const shown = new Map();
function animate(node, key, target) {
  const from = shown.has(key) ? shown.get(key) : target;
  shown.set(key, target);
  if (from < 0 || target < 0 || from === target) { node.textContent = format(target); return; }
  const start = performance.now();
  const step = now => {
    const t = Math.min(1, (now - start) / 800);
    node.textContent = format(Math.round(from + (target - from) * (1 - Math.pow(1 - t, 3))));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function item(icon, key, viewers, name) {
  const row = document.createElement('span');
  row.className = 'item';
  const pf = document.createElement('span');
  pf.className = 'pf';
  pf.innerHTML = icon;
  const count = document.createElement('span');
  animate(count, key, viewers);
  row.append(pf, count);
  if (name) {
    const n = document.createElement('span');
    n.className = 'name';
    n.textContent = name;
    row.appendChild(n);
  }
  return row;
}

function render() {
  let live = sources.filter(s => s.live === 1 && s.platform !== 'demo' && config.platforms.includes(s.platform));
  if (!live.length && config.preview && !config.streaming)
    live = SAMPLE.filter(s => config.platforms.includes(s.platform));
  box.textContent = '';
  for (const s of live)
    box.appendChild(item(ICONS[s.platform] || '', s.platform + ':' + s.channel, s.viewers, s.channel));
  const known = live.filter(s => s.viewers >= 0);
  if (config.total && live.length > 1 && known.length) {
    const total = item(EYE, 'total', known.reduce((sum, s) => sum + s.viewers, 0));
    total.classList.add('total');
    box.appendChild(total);
  }
  document.body.classList.toggle('empty', !live.length);
}

function applyConfig(c) {
  const before = JSON.stringify(config);
  config = { ...config, ...c };
  if (JSON.stringify(config) === before && box.childElementCount) return; // el reenvío periódico
  document.documentElement.style.setProperty('--fs', config.size + 'px');
  document.documentElement.style.setProperty('--bg-alpha', String(config.opacity / 100));
  document.body.classList.toggle('bg', !!config.background);
  document.body.classList.toggle('column', config.layout === 'column');
  document.body.classList.toggle('nonames', !config.names);
  render();
}

window.addEventListener('multichat', e => {
  const data = e.detail || {};
  if (data.type === 'config') applyConfig(data.config || {});
  else if (data.type === 'viewers') {
    sources = data.sources || [];
    render();
  }
});

applyConfig({});
</script>
</body>
</html>
