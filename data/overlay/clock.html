<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat · fecha y hora</title>
<!-- La fuente "Multichat (fecha y hora)" carga esta página y le manda la configuración con el
     evento "multichat" (javascript_event de obs-browser): {type: "config", config: {...}}.
     El plugin da a la fuente el tamaño aproximado del recuadro; aquí se escala el recuadro
     para que la llene justo. -->
<style>
  :root { --pad-y: 11px; --pad-x: 19px; --fs: 32px; --bg-rgb: 0, 0, 0; --bg-alpha: .6; --bg-radius: 12px; --bg-bw: 0px; --bg-brgb: 255, 255, 255; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: var(--fg, #fff); font: var(--fw, 800) var(--fs)/1.2 var(--font, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif);
    text-shadow: var(--ts); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #box { position: absolute; top: 0; left: 0; transform-origin: 0 0; display: inline-flex; align-items: center;
    gap: .45em; padding: var(--pad-y) var(--pad-x); border-radius: .45em; white-space: nowrap; }
  body.bg #box { background: rgba(var(--bg-rgb), var(--bg-alpha)); border-radius: var(--bg-radius);
    border: var(--bg-bw) solid rgb(var(--bg-brgb)); text-shadow: none; }
  .bar { width: .18em; height: 1.15em; background: var(--fg, #fff); box-shadow: 0 0 3px #000c; }
  body.bg .bar { box-shadow: none; }
  .nobar .bar { display: none; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="box"><span class="bar"></span><span id="text"></span></div>
<script src="icons.js"></script>
<script>
// Custom CSS from the source properties, in its own <style> after every other style. Only
// textContent: it is CSS text, never HTML or script.
function applyCustomCss(css) {
  let style = document.getElementById('user-css');
  if (!style) {
    style = document.createElement('style');
    style.id = 'user-css';
    document.head.appendChild(style);
  }
  const text = typeof css === 'string' ? css.slice(0, 20480) : '';
  if (style.textContent !== text) style.textContent = text;
}

// Typography from the plugin (font, weight, colors, outline, shadow, line height). The values
// are CSS strings built by the plugin; setProperty ignores anything that is not valid CSS.
// defaultWeight: the text weight of the page when the plugin sends none.
function applyTextStyle(c, defaultWeight) {
  const root = document.documentElement.style;
  const set = (name, value, fallback) => root.setProperty(name, typeof value === 'string' && value ? value : fallback);
  set('--font', c.font, '"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif');
  root.setProperty('--fw', String(Number(c.textWeight) || defaultWeight));
  set('--fg', c.textColor, '#fff');
  root.setProperty('--ow', (Number(c.outlineWidth) || 0) + 'px');
  set('--oc', c.outlineColor, '#000');
  set('--sc', c.shadowColor, 'rgba(0, 0, 0, 1)');
  root.setProperty('--sb', (Number(c.shadowBlur ?? 6) || 0) + 'px');
  if (Number(c.lineHeight) > 0) root.setProperty('--lh', String(Number(c.lineHeight) / 100));
  const body = document.body.classList;
  body.toggle('outline', Number(c.outlineWidth) > 0);
  body.toggle('ts-on', c.shadowMode === 'on');
  body.toggle('ts-off', c.shadowMode === 'off');
}

let config = { size: 32, date: true, time: true, seconds: false, hour24: true, bar: true, background: true, style: 'solid', bgColor: '#000000', bgOpacity: 60, bgRadius: 12, bgBorderWidth: 0, bgBorderColor: '#ffffff' };
const box = document.getElementById('box');
const text = document.getElementById('text');


// El recuadro llena la fuente: se escala a lo que permita el ancho o el alto.
function fit() {
  box.style.transform = '';
  const w = box.offsetWidth, h = box.offsetHeight;
  if (w && h) box.style.transform = `scale(${Math.min(innerWidth / w, innerHeight / h)})`;
}
addEventListener('resize', fit);

let last = '';
function tick() {
  const value = clockLabel(new Date(), config);
  if (value !== last) {
    last = value;
    text.textContent = value;
    fit();
  }
}
setInterval(tick, 250);

window.addEventListener('multichat', e => {
  const data = e.detail || {};
  if (data.type !== 'config') return;
  config = { ...config, ...(data.config || {}) };
  document.documentElement.style.setProperty('--fs', config.size + 'px');
  applyBoxStyle(config, 'bg');
  applyTextStyle(config, 800);
  applyCustomCss(config.customCss);
  document.documentElement.style.setProperty('--pad-y', (config.padY ?? 11) + 'px');
  document.documentElement.style.setProperty('--pad-x', (config.padX ?? 19) + 'px');
  document.documentElement.dataset.style = config.style || 'solid';
  document.body.classList.toggle('bg', !!config.background);
  document.body.classList.toggle('nobar', !config.bar);
  last = '';
  tick();
});

tick();
</script>
</body>
</html>
