<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat (destacado)</title>
<!-- La fuente "Multichat (destacado)" del plugin carga esta página y le manda, con el evento
     "multichat" (javascript_event de obs-browser):
       {type: "config", config: {...}}
       {type: "featured", message: {...} | null, at: <ms en que se destacó>}
     El estado vive en el plugin: tras recargar la página, el siguiente envío lo repone. El
     plugin también decide cuándo se oculta solo (manda message: null al vencer), así el dock,
     los atajos y todas las fuentes de destacado van a la vez; "at" distingue dos destacados
     seguidos del mismo mensaje.
     El texto del chat se pone siempre como texto (textContent), nunca como HTML. -->
<style>
  :root { --fs: 34px; --pad-y: 16px; --pad-x: 22px; --dur: 300ms; --from: translateY(1.2em);
    --bg-rgb: 0, 0, 0; --bg-alpha: .75; --bg-radius: 16px; --bg-bw: 0px; --bg-brgb: 255, 255, 255; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { box-sizing: border-box; display: flex; padding: 12px; color: var(--fg, #fff);
    font: 600 var(--fs)/var(--lh, 1.3) var(--font, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif);
    text-shadow: var(--ts); }
  body.v-top { align-items: flex-start; } body.v-center { align-items: center; } body.v-bottom { align-items: flex-end; }
  body.h-left { justify-content: flex-start; } body.h-center { justify-content: center; } body.h-right { justify-content: flex-end; }

  #box { position: relative; box-sizing: border-box; display: flex; align-items: flex-start; gap: .5em;
    max-width: 100%; max-height: 100%; overflow: hidden; padding: var(--pad-y) var(--pad-x);
    opacity: 0; visibility: hidden; transform: var(--from);
    transition: opacity var(--dur) ease, transform var(--dur) ease, visibility 0s linear var(--dur); }
  #box.show { opacity: 1; visibility: visible; transform: none;
    transition: opacity var(--dur) ease, transform var(--dur) ease, visibility 0s; }
  [data-anim="fade"] #box { transform: none; }
  [data-anim="zoom"] #box:not(.show) { transform: scale(.85); }
  [data-anim="none"] #box { transform: none; transition: none; }
  @media (prefers-reduced-motion: reduce) {
    #box, #box:not(.show) { transform: none !important; }
  }
  body.bg #box { background: rgba(var(--bg-rgb), var(--bg-alpha)); border-radius: var(--bg-radius);
    border: var(--bg-bw) solid rgb(var(--bg-brgb)); text-shadow: none; }
  /* Donaciones, Super Chats, bits...: franja del color de la plataforma. */
  #box.hl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .2em; background: var(--pc); }
  body.bg #box.hl { background: color-mix(in srgb, var(--pc) 28%, rgba(var(--bg-rgb), var(--bg-alpha))); }

  .avatar { width: 2.2em; height: 2.2em; border-radius: 50%; object-fit: cover; flex: none; }
  .pf { flex: none; width: 1.5em; height: 1.5em; margin-top: .05em; filter: drop-shadow(0 1px 2px #000a); }
  .pf svg { width: 100%; height: 100%; display: block; }
  .content { min-width: 0; overflow-wrap: anywhere; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .35em; }
  .author { font-weight: 800; }
  .badge { display: inline-block; font-size: .5em; font-weight: 800; padding: .1em .45em; border-radius: .3em;
    text-shadow: none; letter-spacing: .03em; }
  .b-owner { background: #e5484d; } .b-moderator { background: #2f9e58; } .b-vip { background: #d6409f; }
  .b-subscriber, .b-member { background: #6e56cf; } .b-verified, .b-staff { background: #5a6070; }
  .amount { display: inline-block; font-size: .7em; font-weight: 800; padding: .05em .45em; border-radius: .3em;
    background: var(--pc); color: #000; text-shadow: none; }
  .sys { font-size: .65em; opacity: .85; font-style: italic; }
  .text { font-weight: var(--fw, 500); margin-top: .1em; }
  .emote { height: 1.5em; vertical-align: middle; margin: -.25em .05em; }
  .noicons .pf, .nobadges .badge { display: none; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body class="v-bottom h-center">
<div id="box"></div>
<script src="icons.js"></script>
<script src="overlay.js"></script>
<script>

const SAMPLE = { id: 'sample', platform: 'twitch', author: 'LunaGamer', color: '#FF7F50', badges: ['subscriber'],
  parts: [{ type: 'text', text: 'This is a sample featured message!' }], kind: 'chat' };
const DURATION = 300; // ms de la animación de entrada y salida

let config = { size: 34, animation: 'slide', valign: 'bottom', halign: 'center', icons: true, badges: true, padY: 16, padX: 22, background: true,
  style: 'solid', bgColor: '#000000', bgOpacity: 75, bgRadius: 16, bgBorderWidth: 0, bgBorderColor: '#ffffff',
  sample: false, streaming: false };
// Lo último que mandó el plugin.
let state = { message: null, at: 0 };
let shownKey = null;
let ready = false; // hasta la primera configuración no se sabe si se está transmitiendo
let swapTimer = 0;
const box = document.getElementById('box');

function build(m) {
  box.textContent = '';
  box.className = '';
  box.style.setProperty('--pc', own(PLATFORMS, m.platform) ? PLATFORMS[m.platform] : '#888');
  if (m.kind === 'highlight' || m.amount) box.classList.add('hl');

  // Foto del autor si el mensaje la trae; si no, el logo de la plataforma.
  const avatar = safeUrl(m.avatar);
  if (avatar) {
    const img = el('img', 'avatar');
    img.alt = '';
    img.src = avatar;
    img.onerror = () => img.replaceWith(platformIcon(m.platform));
    box.appendChild(img);
  } else {
    box.appendChild(platformIcon(m.platform));
  }

  const content = el('div', 'content');
  if (m.system) content.appendChild(el('div', 'sys', m.system));
  const head = el('div', 'head');
  for (const b of Array.isArray(m.badges) ? m.badges : [])
    if (own(BADGES, b)) head.appendChild(el('span', 'badge b-' + b, badgeLabel(b, config)));
  if (m.amount) head.appendChild(el('span', 'amount', m.amount));
  const author = el('span', 'author', m.author || '');
  author.style.color = authorColor(config, m);
  head.appendChild(author);
  content.appendChild(head);

  const parts = Array.isArray(m.parts) ? m.parts : [];
  if (parts.length) {
    const text = el('div', 'text');
    if (m.action) text.style.color = author.style.color;
    for (const p of parts) {
      if (!p) continue;
      const url = p.type === 'emote' ? safeUrl(p.url) : null;
      if (url) {
        const img = el('img', 'emote');
        img.src = url;
        img.alt = String(p.name || '');
        img.onerror = () => img.replaceWith(document.createTextNode(String(p.name || '')));
        text.appendChild(img);
      } else {
        text.appendChild(document.createTextNode(String(p.type === 'emote' ? p.name || '' : p.text || '')));
      }
    }
    content.appendChild(text);
  }
  box.appendChild(content);
}

function show(m) {
  const enter = () => {
    build(m);
    void box.offsetWidth; // que la animación de entrada arranque desde el estado oculto
    box.classList.add('show');
  };
  // Si ya había otro, primero sale y luego entra el nuevo.
  if (box.classList.contains('show') && config.animation !== 'none') {
    box.classList.remove('show');
    swapTimer = setTimeout(enter, DURATION);
  } else {
    enter();
  }
}

function update() {
  let m = state.message, key = null;
  if (!ready) {
    m = null;
  } else if (m) {
    key = (m.id || '') + '@' + state.at;
  } else if (config.sample && !config.streaming) {
    m = typeof config.sampleText === 'string' && config.sampleText
      ? { ...SAMPLE, parts: [{ type: 'text', text: config.sampleText }] } : SAMPLE;
    key = 'sample';
  }
  if (!m) {
    clearTimeout(swapTimer);
    box.classList.remove('show');
    shownKey = null;
    return;
  }
  if (key !== shownKey) {
    clearTimeout(swapTimer);
    shownKey = key;
    show(m);
  }
}

function applyConfig(c) {
  config = { ...config, ...c };
  const root = document.documentElement;
  root.style.setProperty('--fs', config.size + 'px');
  root.style.setProperty('--pad-y', config.padY + 'px');
  root.style.setProperty('--pad-x', config.padX + 'px');
  root.style.setProperty('--dur', (config.animation === 'none' ? 0 : DURATION) + 'ms');
  root.style.setProperty('--from', config.valign === 'top' ? 'translateY(-1.2em)' : 'translateY(1.2em)');
  root.dataset.anim = config.animation || 'slide';
  root.dataset.style = config.style || 'solid';
  applyBoxStyle(config, 'bg');
  applyTextStyle(config, 500);
  applyCustomCss(config.customCss);
  const body = document.body;
  for (const v of ['top', 'center', 'bottom']) body.classList.toggle('v-' + v, config.valign === v);
  for (const h of ['left', 'center', 'right']) body.classList.toggle('h-' + h, config.halign === h);
  body.classList.toggle('bg', !!config.background);
  body.classList.toggle('noicons', !config.icons);
  body.classList.toggle('nobadges', !config.badges);
  update();
}

window.addEventListener('multichat', e => {
  const data = e.detail || {};
  if (data.type === 'config') {
    ready = true;
    applyConfig(data.config || {});
  } else if (data.type === 'featured') {
    const message = data.message && typeof data.message === 'object' ? data.message : null;
    state = { message, at: Number(data.at) || 0 };
    update();
  }
});

applyConfig({});
</script>
</body>
</html>
