<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat</title>
<!-- La fuente "Multichat" del plugin carga esta página y le manda los mensajes con el
     evento "multichat" (javascript_event de obs-browser):
       {type: "config", config: {...}} · {type: "message", message: {...}} · {type: "clear"}
       · {type: "delete", ...} · {type: "restore", messages: [...]} (deshacer tras vaciar) -->
<style>
  :root { --fs: 22px; --gap: 5px; --pad-y: 6px; --pad-x: 10px; --msg-py: 5px; --msg-px: 11px; --bg-rgb: 0, 0, 0; --bg-alpha: .6; --bg-radius: 9px; --bg-bw: 0px; --bg-brgb: 255, 255, 255;
    --panel-rgb: 0, 0, 0; --panel-alpha: .5; --panel-radius: 0px; --panel-bw: 0px; --panel-brgb: 255, 255, 255; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: var(--fg, #fff); font: 600 var(--fs)/var(--lh, 1.35) var(--font, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif);
    text-shadow: var(--ts); }
  #list { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: var(--pad-y) var(--pad-x); }
  /* Margen y no gap: así el espaciado puede ser negativo (los mensajes se solapan). */
  .msg + .msg { margin-top: var(--gap); }
  body.top #list { justify-content: flex-start; }
  .msg { position: relative; overflow-wrap: anywhere; animation: in .25s ease-out; transition: opacity .6s, transform .6s; }
  .msg.out { opacity: 0; transform: translateX(-12px); }
  body.bg .msg { background: rgba(var(--bg-rgb), var(--bg-alpha)); padding: var(--msg-py) var(--msg-px); border-radius: var(--bg-radius);
    border: var(--bg-bw) solid rgb(var(--bg-brgb)); text-shadow: none; }
  .msg.hl { border-left: 4px solid var(--pc); padding-left: max(0px, calc(var(--msg-px) - 2px)); }
  body.bg .msg.hl { background: color-mix(in srgb, var(--pc) 30%, rgba(var(--bg-rgb), var(--bg-alpha))); }
  .sys { font-size: .8em; opacity: .85; font-style: italic; }
  .pf { display: inline-block; vertical-align: -.15em; margin-right: .3em; filter: drop-shadow(0 1px 2px #000a); }
  .pf svg { width: 1em; height: 1em; display: block; }
  .badge { display: inline-block; font-size: .55em; font-weight: 800; padding: .1em .4em; margin-right: .35em;
    border-radius: .3em; vertical-align: .25em; text-shadow: none; letter-spacing: .03em; }
  .b-owner { background: #e5484d; } .b-moderator { background: #2f9e58; } .b-vip { background: #d6409f; }
  .b-subscriber, .b-member { background: #6e56cf; } .b-verified, .b-staff { background: #5a6070; }
  .amount { display: inline-block; font-size: .75em; font-weight: 800; padding: .05em .4em; margin-right: .35em;
    border-radius: .3em; background: var(--pc); color: #000; text-shadow: none; }
  .author { font-weight: 800; }
  .body { font-weight: var(--fw, 500); }
  .emote { height: 1.6em; vertical-align: middle; margin: -.3em .05em; }
  .noicons .pf, .nobadges .badge { display: none; }
  /* Fondo general detrás de todo el chat. */
  #panel { display: none; position: fixed; inset: 0; box-sizing: border-box; background: rgba(var(--panel-rgb), var(--panel-alpha));
    border-radius: var(--panel-radius); border: var(--panel-bw) solid rgb(var(--panel-brgb)); }
  body.panel #panel { display: block; }
  /* Horizontal: una sola línea que avanza de derecha a izquierda. */
  body.h #list { display: block; padding: 0; overflow: hidden; left: var(--pad-x); right: var(--pad-x); }
  body.h .msg { position: absolute; left: 0; top: 50%; white-space: nowrap; overflow-wrap: normal;
    animation: none; transition: none; will-change: transform; }
  body.h .sys { display: inline; margin-right: .5em; }
  body.h .msg + .msg { margin-top: 0; }
  /* Date and time: fixed at the end of the ticker (messages stop before reaching it) or,
     in the vertical list, above or below the messages. */
  #clock { display: none; position: absolute; right: var(--pad-x); top: 50%; transform: translateY(-50%); align-items: center;
    gap: .45em; padding: 0 .45em 0 .35em; white-space: nowrap; font-weight: 800; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; }
  body.clock #clock { display: flex; }
  body:not(.h) #clock { top: var(--pad-y); left: var(--pad-x); right: auto; transform: none; }
  body:not(.h).clock-bottom #clock { top: auto; bottom: var(--pad-y); }
  .nobar #clock .bar { display: none; }
  #clock .bar { width: .18em; height: 1.15em; background: var(--fg, #fff); box-shadow: 0 0 3px #000c; }
  body.bg #clock { background: rgba(var(--bg-rgb), var(--bg-alpha)); padding: var(--msg-py) var(--msg-px); border-radius: var(--bg-radius);
    border: var(--bg-bw) solid rgb(var(--bg-brgb)); text-shadow: none; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="panel"></div>
<div id="list"></div>
<div id="clock"><span class="bar"></span><span id="clock-text"></span></div>
<script src="icons.js"></script>
<script src="overlay.js"></script>
<script>

let config = { size: 22, fade: 0, max: 15, platforms: ['twitch', 'youtube', 'kick', 'tiktok', 'starvios'], icons: true, badges: true,
  background: false, style: 'solid', bgColor: '#000000', bgOpacity: 60, bgRadius: 9, bgBorderWidth: 0, bgBorderColor: '#ffffff',
  panel: false, panelColor: '#000000', panelOpacity: 50, panelRadius: 0, panelBorderWidth: 0, panelBorderColor: '#ffffff', align: 'bottom', layout: 'vertical', scroll: 'continuous', clock: false, clockDate: true, clockTime: true, clockSeconds: false, clockHour24: true, clockBar: true, clockPosition: 'top', speed: 120, spacing: 5, hspacing: 48, padY: 6, padX: 10, msgPadY: 5, msgPadX: 11, sample: false, streaming: false };
let lastReal = 0;
// Ids already shown, oldest first. Past the limit the oldest is forgotten, never all at once:
// clearing everything would let a reconnect replay recent messages.
const SEEN_LIMIT = 2000;
const seen = new Set();
let seenOrder = [];
function remember(id) {
  seen.add(id);
  seenOrder.push(id);
  if (seenOrder.length > SEEN_LIMIT) for (const old of seenOrder.splice(0, seenOrder.length - SEEN_LIMIT)) seen.delete(old);
}
function forgetAll() {
  seen.clear();
  seenOrder = [];
}
const list = document.getElementById('list');

function render(m) {
  const row = el('div', 'msg' + (m.kind === 'highlight' ? ' hl' : ''));
  row.dataset.id = m.id || '';
  row.dataset.source = m.source || '';
  row.style.setProperty('--pc', PLATFORMS[m.platform] || '#888');
  if (m.system) row.appendChild(el('div', 'sys', m.system));
  row.appendChild(platformIcon(m.platform));
  for (const b of m.badges || []) if (BADGES[b]) row.appendChild(el('span', 'badge b-' + b, badgeLabel(b, config)));
  if (m.amount) row.appendChild(el('span', 'amount', m.amount));
  const author = el('span', 'author', m.author);
  author.style.color = authorColor(config, m);
  row.appendChild(author);
  if (m.parts && m.parts.length) {
    row.appendChild(document.createTextNode(m.action ? ' ' : ': '));
    const body = el('span', 'body');
    if (m.action) body.style.color = author.style.color;
    for (const p of m.parts) {
      const src = p.type === 'emote' ? safeUrl(p.url) : null;
      if (p.type === 'emote' && !src) {
        body.appendChild(document.createTextNode(p.name || ''));
      } else if (p.type === 'emote') {
        const img = el('img', 'emote');
        img.src = src;
        img.alt = p.name;
        img.onerror = () => img.replaceWith(document.createTextNode(p.name));
        body.appendChild(img);
      } else {
        body.appendChild(document.createTextNode(p.text));
      }
    }
    row.appendChild(body);
  }
  return row;
}

function remove(row) {
  row.classList.add('out');
  setTimeout(() => row.remove(), 600);
}

// En vertical solo se ven mensajes enteros dentro del margen: los que asoman por el borde
// (arriba al apilar desde abajo, abajo al apilar desde arriba) se quitan, el más antiguo primero.
function trimOverflow() {
  if (config.layout === 'horizontal') return;
  const style = getComputedStyle(list);
  const top = parseFloat(style.paddingTop);
  const bottom = list.clientHeight - parseFloat(style.paddingBottom);
  const rows = [...list.children];
  if (config.align === 'top') {
    while (rows.length > 1) {
      const last = rows[rows.length - 1];
      if (last.offsetTop + last.offsetHeight <= bottom + 0.5) break;
      rows.shift().remove();
    }
  } else {
    while (rows.length > 1 && rows[0].offsetTop < top - 0.5)
      rows.shift().remove();
  }
}
addEventListener('resize', trimOverflow);

function add(m) {
  if (!config.platforms.includes(m.platform)) return;
  if (m.id) {
    if (seen.has(m.id)) return;
    remember(m.id);
  }
  const row = render(m);
  if (config.layout === 'horizontal') {
    row.x = list.clientWidth; // entra por la derecha; tick() lo pone detrás del anterior
    row.style.transform = `translate(${row.x}px, -50%)`;
    list.appendChild(row);
    return;
  }
  list.appendChild(row);
  const shown = [...list.children].filter(c => !c.classList.contains('out'));
  for (const old of shown.slice(0, Math.max(0, shown.length - config.max))) remove(old);
  trimOverflow();
  // Las imágenes (emotes) llegan después y pueden hacer crecer el mensaje.
  for (const img of row.querySelectorAll('img')) img.addEventListener('load', trimOverflow, { once: true });
  if (config.fade > 0) setTimeout(() => remove(row), config.fade * 1000);
}

// Avance del modo horizontal:
// - continuo: la cinta no para; si se acumulan mensajes fuera de pantalla, acelera.
// - por comentario: avanza lo justo para que el último mensaje quede entero a la derecha y se
//   detiene hasta que llega otro.
let lastFrame = 0;
function tick(now) {
  const dt = lastFrame ? Math.min(now - lastFrame, 100) / 1000 : 0;
  lastFrame = now;
  if (config.layout === 'horizontal' && list.children.length) {
    const width = list.clientWidth;
    const rows = [...list.children];
    const last = rows[rows.length - 1];
    let step, targets = null;
    if (config.scroll === 'message') {
      targets = [];
      let right = width; // la cinta ya deja el margen a los lados
      for (let i = rows.length - 1; i >= 0; i--) {
        targets[i] = right - rows[i].offsetWidth;
        right = targets[i] - config.hspacing;
      }
      // Más rápido cuanto más falte, para no quedarse atrás si escriben mucho.
      step = Math.max(config.speed, (last.x - targets[rows.length - 1]) * 3) * dt;
    } else {
      const backlog = Math.max(0, last.x + last.offsetWidth - width);
      step = config.speed * (1 + backlog / (width * 2)) * dt;
    }
    let edge = -Infinity;
    for (const [i, row] of rows.entries()) {
      row.x = Math.max(row.x - step, edge, targets ? targets[i] : -Infinity);
      edge = row.x + row.offsetWidth + config.hspacing;
      if (edge - config.hspacing < 0) row.remove();
      else row.style.transform = `translate(${row.x}px, -50%)`;
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// "28 OCT 2026 04:20" en el idioma del sistema, con hora de 24 h.
const clock = document.getElementById('clock');
const clockText = document.getElementById('clock-text');
function updateClock() {
  list.style.right = '';
  list.style.top = '';
  list.style.bottom = '';
  if (!config.clock) return;
  clockText.textContent = clockLabel(new Date(), { date: config.clockDate, time: config.clockTime,
    seconds: config.clockSeconds, hour24: config.clockHour24 });
  document.body.classList.toggle('nobar', config.clockBar === false);
  // Entre el último mensaje y el reloj, el mismo espacio que entre mensajes.
  if (config.layout === 'horizontal') {
    list.style.right = `calc(${clock.offsetWidth}px + var(--pad-x) + ${Math.max(0, config.hspacing)}px)`;
    return;
  }
  const inset = `${clock.offsetHeight + Math.max(0, config.spacing)}px`;
  if (config.clockPosition === 'bottom') list.style.bottom = inset;
  else list.style.top = inset;
}
setInterval(updateClock, 1000);

function applyConfig(c) {
  const { layout, scroll } = config;
  config = { ...config, ...c };
  if (config.layout !== layout || config.scroll !== scroll) list.textContent = '';
  document.body.classList.toggle('h', config.layout === 'horizontal');
  document.documentElement.style.setProperty('--fs', config.size + 'px');
  const root = document.documentElement.style;
  applyBoxStyle(config, 'bg');
  applyBoxStyle(config, 'panel');
  applyTextStyle(config, 500);
  applyCustomCss(config.customCss);
  document.documentElement.dataset.style = config.style || 'solid';
  root.setProperty('--gap', config.spacing + 'px');
  root.setProperty('--pad-y', config.padY + 'px');
  root.setProperty('--pad-x', config.padX + 'px');
  root.setProperty('--msg-py', config.msgPadY + 'px');
  root.setProperty('--msg-px', config.msgPadX + 'px');
  document.body.classList.toggle('panel', !!config.panel);
  document.body.classList.toggle('bg', !!config.background);
  document.body.classList.toggle('top', config.align === 'top');
  document.body.classList.toggle('noicons', !config.icons);
  document.body.classList.toggle('nobadges', !config.badges);
  document.body.classList.toggle('clock', !!config.clock);
  document.body.classList.toggle('clock-bottom', config.clockPosition === 'bottom');
  updateClock();
  trimOverflow();
}

// Moderation: the platform deleted messages (by id) or cleared a whole channel (all).
// Never touches rows from another source.
function removeDeleted(d) {
  const ids = new Set(d.ids || []);
  if (d.id) ids.add(d.id);
  for (const row of [...list.children]) {
    if (row.classList.contains('out')) continue;
    const hit = d.all ? row.dataset.source === d.source : ids.has(row.dataset.id);
    if (hit && row.dataset.source === (d.source || '')) remove(row);
  }
}

// Undo after clearing: the plugin sends the history again (oldest first). The list starts
// over with it; the ticker only gets the last few so it does not replay a long backlog.
function restore(messages) {
  list.textContent = '';
  forgetAll();
  const items = (Array.isArray(messages) ? messages : []).filter(m => m && typeof m === 'object');
  for (const m of config.layout === 'horizontal' ? items.slice(-3) : items) {
    if (m.channel !== 'demo') lastReal = Date.now();
    add(m);
  }
}

window.addEventListener('multichat', e => {
  const data = e.detail || {};
  if (data.type === 'config') applyConfig(data.config || {});
  else if (data.type === 'message' && data.message) {
    if (data.message.channel !== 'demo') lastReal = Date.now();
    add(data.message);
  } else if (data.type === 'delete') removeDeleted(data);
  else if (data.type === 'clear') list.textContent = '';
  else if (data.type === 'restore') restore(data.messages);
});

// Mensajes de ejemplo para colocar el overlay mientras no llega chat de verdad. El texto llega
// traducido en config.samples; estos son los de reserva.
const SAMPLES = [
  ['twitch', 'LunaGamer', '#FF7F50', ['subscriber'], 'Hiii from Buenos Aires!'],
  ['youtube', 'María Fernández', '', ['member'], 'great stream today'],
  ['kick', 'kicker_mx', '#53FC18', [], 'hello to everyone in the Kick chat'],
  ['tiktok', 'vale.tok', '', [], 'hiii from TikTok 💖'],
  ['starvios', 'nova_estelar', '#A78BFA', [], 'hi from Starvios ✨'],
  ['twitch', 'pixel_pancho', '#1E90FF', ['moderator'], 'GG'],
  ['youtube', 'Carlos R.', '', [], "let's gooo 💪"],
];
let sample = 0;
setInterval(() => {
  if (!config.sample || config.streaming || Date.now() - lastReal < 30000) return;
  const index = sample++ % SAMPLES.length;
  const [platform, author, color, badges, fallback] = SAMPLES[index];
  const texts = Array.isArray(config.samples) ? config.samples : [];
  const text = typeof texts[index] === 'string' && texts[index] ? texts[index] : fallback;
  add({ id: 'sample-' + sample, platform, author, color, badges, parts: [{ type: 'text', text }], kind: 'chat' });
}, 2500);

applyConfig({});
</script>
</body>
</html>
