Wizard.Welcome.Title="Your stream's chats, together"
Wizard.Welcome.Text="Multichat joins the chats of Twitch, YouTube, Kick, TikTok and Starvios in a single dock and shows them on screen. In three short steps you will add your channel and put the chat in your scene. You can skip this and open it again from Tools → Multichat… → First-run assistant."
Wizard.Chat.Title="1. Add your channel"
Wizard.Chat.Text="The platform follows the streaming service set in OBS. Type your channel name or paste its URL and press Add; repeat if you stream to more platforms."
Wizard.Chat.Added="Added: %1"
Wizard.Chat.Demo="Also show test messages (to try it without being live)"
Wizard.Chat.Later="You can add, pause or reorder channels later in Tools → Multichat…"
Wizard.Sources.Title="2. Put the chat on screen"
Wizard.Sources.Text="One click puts the chat, the featured message and the voice in the scene you are editing; untick what you do not want. Then move and resize them like any other source."
Wizard.Sources.FeaturedHelp="The featured source shows in large the message you click in the dock."
Wizard.Sources.VoiceHelp="The voice reads the chat aloud or plays a notification sound, depending on its mode. Control it from the audio mixer."
Wizard.Sources.Add="Add to scene “%1”"
Wizard.Sources.AddNoScene="Add to the current scene"
Wizard.Sources.Added="Added “%1” to the scene “%2”."
Wizard.Sources.AlreadyThere="“%1” is already in the scene “%2”."
Wizard.Sources.NoScene="There is no scene to add it to: create one in OBS first."
Wizard.Sources.Failed="“%1” could not be added. Add it from Sources → + → Multichat."
Wizard.Done.Title="3. Ready"
Wizard.Done.Text="Multichat connects your chats when you go live (or always, if you choose so in its settings). Some useful things:"
Wizard.Done.TipDock="Finishing opens the Multichat dock: there you read, feature and hide messages. If you close it, bring it back from the Docks menu."
Wizard.Done.TipSettings="Tools → Multichat… adds, pauses and reorders channels, sets the filters and checks for updates."
Wizard.Done.TipHotkeys="Settings → Hotkeys has shortcuts to clear the featured message and show the last one again."
Wizard.Done.TipReopen="This assistant is in Tools → Multichat… and in the dock's gear menu."
