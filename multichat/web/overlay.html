<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multichat overlay</title>
<!--
  Parámetros opcionales en la URL:
    ?fade=30          segundos hasta que un mensaje desaparece (0 = nunca)
    &max=15           número máximo de mensajes en pantalla
    &size=20          tamaño de letra en px
    &platforms=twitch,kick   mostrar solo esas plataformas
    &icons=0 / &badges=0     ocultar iconos de plataforma / insignias
    &bg=1             fondo semitransparente detrás de cada mensaje
    &align=top        apilar desde arriba en lugar de desde abajo
-->
<style>
  :root { --fs: 20px; --pc: #888; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: #fff; font: 600 var(--fs)/1.35 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    text-shadow: 0 0 2px #000, 0 1px 3px #000c, 0 0 6px #0008; }
  #list { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 4px; }
  body.top #list { justify-content: flex-start; }
  .msg { overflow-wrap: anywhere; animation: in .25s ease-out; transition: opacity .6s, transform .6s; }
  .msg.out { opacity: 0; transform: translateX(-12px); }
  body.bg .msg { background: #000a; padding: 4px 10px; border-radius: 8px; text-shadow: none; }
  .msg.hl { border-left: 4px solid var(--pc); padding-left: 8px; }
  body.bg .msg.hl { background: color-mix(in srgb, var(--pc) 30%, #000a); }
  .sys { font-size: .8em; opacity: .85; font-style: italic; }
  .pf { display: inline-block; vertical-align: -.15em; margin-right: .3em; filter: drop-shadow(0 1px 2px #000a); }
  .pf svg { width: 1em; height: 1em; display: block; }
  .badge { display: inline-block; font-size: .55em; font-weight: 800; padding: .1em .4em; margin-right: .35em; border-radius: .3em; vertical-align: .25em; text-shadow: none; letter-spacing: .03em; }
  .b-owner { background: #e5484d; } .b-mod { background: #2f9e58; } .b-vip { background: #d6409f; }
  .b-sub { background: #6e56cf; } .b-verified { background: #5a6070; }
  .amount { display: inline-block; font-size: .75em; font-weight: 800; padding: .05em .4em; margin-right: .35em; border-radius: .3em; background: var(--pc); color: #000; text-shadow: none; }
  .author { font-weight: 800; }
  .body { font-weight: 500; }
  .emote { height: 1.6em; vertical-align: middle; margin: -.3em .05em; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div id="list"></div>
<script src="/static/common.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const fade = Number(q.get('fade') ?? 0);
  const max = Number(q.get('max') ?? 15);
  const only = q.get('platforms') ? new Set(q.get('platforms').split(',').map(s => s.trim().toLowerCase())) : null;
  const opts = { icons: q.get('icons') !== '0', badges: q.get('badges') !== '0' };
  if (q.get('size')) document.documentElement.style.setProperty('--fs', Number(q.get('size')) + 'px');
  if (q.get('bg') === '1') document.body.classList.add('bg');
  if (q.get('align') === 'top') document.body.classList.add('top');
  const list = document.getElementById('list');

  function remove(el) {
    el.classList.add('out');
    setTimeout(() => el.remove(), 600);
  }

  function add(m) {
    if (only && !only.has(m.platform)) return;
    const el = renderMessage(m, opts);
    list.appendChild(el);
    const live = [...list.children].filter(c => !c.classList.contains('out'));
    for (const old of live.slice(0, Math.max(0, live.length - max))) remove(old);
    if (fade > 0) setTimeout(() => remove(el), fade * 1000);
  }

  connectEvents({ history: false, onMessage: add, onClear: () => { list.textContent = ''; } });
</script>
</body>
</html>
