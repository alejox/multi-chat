<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multichat</title>
<style>
  :root {
    --bg: #1d1f26; --panel: #272a33; --line: #343844; --text: #e6e8ee; --muted: #9aa0ad;
    --live: #ff3b3b; --ok: #3ecf6e; --warn: #f5b942; --err: #ff6b6b; --accent: #5b8cff;
    --fs: 13px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header { padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .top { display: flex; align-items: center; gap: 6px; }
  .title { font-weight: 600; font-size: 12px; letter-spacing: .02em; }
  .onair { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .onair.on { color: var(--live); font-weight: 600; }
  .tools { display: flex; gap: 2px; }
  .tools button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .tools button:hover { background: var(--line); color: var(--text); }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line); cursor: pointer; font-size: 11px; user-select: none; max-width: 100%; }
  .chip .pf svg { width: 14px; height: 14px; display: block; }
  .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .chip[data-status=connected] .dot { background: var(--ok); }
  .chip[data-status=connecting] .dot, .chip[data-status=waiting] .dot { background: var(--warn); }
  .chip[data-status=error] .dot { background: var(--err); }
  .chip .livetag { background: var(--live); color: #fff; font-weight: 700; font-size: 9px; padding: 0 4px; border-radius: 3px; letter-spacing: .04em; }
  .chip.off { opacity: .4; }

  .banner { display: none; padding: 5px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
    background: linear-gradient(90deg, #9146ff33, #ff003333, #53fc1833); border: 1px solid var(--line); }
  .banner.show { display: flex; align-items: center; gap: 6px; }
  .banner .pf svg { width: 14px; height: 14px; display: block; }
  .notice { font-size: 11px; color: var(--err); }

  #list { flex: 1; overflow-y: auto; padding: 4px 0; overscroll-behavior: contain; }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .msg { padding: 3px 8px 3px 10px; border-left: 2px solid transparent; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg:hover { background: #ffffff08; border-left-color: var(--pc); }
  .msg.hl { background: color-mix(in srgb, var(--pc) 14%, transparent); border-left-color: var(--pc); margin: 2px 0; }
  .msg .sys { font-size: 11.5px; color: var(--muted); font-style: italic; }
  .msg .pf { display: inline-block; vertical-align: -3px; margin-right: 5px; }
  .msg .pf svg { width: 15px; height: 15px; display: block; }
  .notime .time { display: none; }
  .time { color: var(--muted); font-size: 11px; margin-right: 5px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 0 4px; margin-right: 4px; border-radius: 3px; vertical-align: 1px; letter-spacing: .03em; color: #fff; }
  .b-owner { background: #e5484d; } .b-mod { background: #2f9e58; } .b-vip { background: #d6409f; }
  .b-sub { background: #6e56cf; } .b-verified { background: #5a6070; }
  .amount { display: inline-block; font-weight: 700; font-size: 11px; padding: 0 5px; margin-right: 5px; border-radius: 3px; background: var(--pc); color: #000; }
  .author { font-weight: 700; }
  .sep { color: var(--muted); }
  .emote { height: 1.75em; vertical-align: middle; margin: -4px 1px; }

  .empty { color: var(--muted); text-align: center; padding: 24px 16px; font-size: 12px; line-height: 1.6; }
  .empty code { background: var(--panel); padding: 1px 5px; border-radius: 4px; color: var(--text); }

  #jump { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: none;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px #0006; }
  #jump.show { display: block; }
  #offline { display: none; background: var(--err); color: #000; font-size: 11px; text-align: center; padding: 2px; }
  #offline.show { display: block; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
</style>
</head>
<body>
<div id="offline">Sin conexión con el script de OBS… reintentando</div>
<header>
  <div class="top">
    <span class="title">Multichat</span>
    <span class="onair" id="onair">Fuera de directo</span>
    <div class="tools">
      <button id="btnSmaller" title="Texto más pequeño">A−</button>
      <button id="btnBigger" title="Texto más grande">A+</button>
      <button id="btnTime" title="Mostrar/ocultar hora">🕒</button>
      <button id="btnRefresh" title="Volver a detectar plataformas en vivo">⟳</button>
      <button id="btnOverlay" title="Copiar URL del overlay">⧉</button>
      <button id="btnClear" title="Limpiar chat">🗑</button>
    </div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="chips" id="chips"></div>
  <div class="notice" id="notice"></div>
</header>
<main>
  <div id="list"></div>
  <button id="jump">↓ Nuevos mensajes</button>
</main>
<script src="/static/common.js"></script>
<script>
  const MAX = 500;
  const list = document.getElementById('list');
  const jump = document.getElementById('jump');
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const hidden = new Set(load('mc.hidden') || []);
  let fs = load('mc.fs') || 13;
  let showTime = !!load('mc.time');
  let stickToBottom = true;
  let state = { sources: [] };

  const applyFs = () => document.documentElement.style.setProperty('--fs', fs + 'px');
  applyFs();
  document.body.classList.toggle('notime', !showTime);

  const visible = el => !hidden.has(el.dataset.source);

  function add(m) {
    const el = renderMessage(m, { time: true });
    if (!visible(el)) el.hidden = true;
    list.appendChild(el);
    while (list.children.length > MAX) list.firstChild.remove();
    list.querySelector('.empty')?.remove();
    if (stickToBottom) list.scrollTop = list.scrollHeight;
    else jump.classList.add('show');
  }

  list.addEventListener('scroll', () => {
    stickToBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
    if (stickToBottom) jump.classList.remove('show');
  });
  jump.onclick = () => { list.scrollTop = list.scrollHeight; };

  function refilter() {
    for (const el of list.querySelectorAll('.msg')) el.hidden = !visible(el);
    if (stickToBottom) list.scrollTop = list.scrollHeight;
  }

  const STATUS_TEXT = { connected: 'conectado', connecting: 'conectando…', waiting: 'esperando directo', error: 'error', idle: 'desconectado' };

  function renderState(s) {
    state = s;
    const chips = document.getElementById('chips');
    chips.textContent = '';
    for (const src of s.sources) {
      const c = document.createElement('div');
      c.className = 'chip' + (hidden.has(src.key) ? ' off' : '');
      c.dataset.status = src.status;
      const liveTxt = src.live === true ? 'en vivo' : src.live === false ? 'offline' : 'estado desconocido';
      c.title = `${PLATFORMS[src.platform]?.name || src.platform} · ${src.channel}\n${STATUS_TEXT[src.status] || src.status} · ${liveTxt}` +
        (src.detail ? `\n${src.detail}` : '') + '\nClic para mostrar/ocultar sus mensajes';
      c.appendChild(iconEl(src.platform));
      const dot = document.createElement('span'); dot.className = 'dot'; c.appendChild(dot);
      const name = document.createElement('span'); name.className = 'name'; name.textContent = src.channel; c.appendChild(name);
      if (src.live) { const l = document.createElement('span'); l.className = 'livetag'; l.textContent = 'LIVE'; c.appendChild(l); }
      c.onclick = () => {
        hidden.has(src.key) ? hidden.delete(src.key) : hidden.add(src.key);
        store('mc.hidden', [...hidden]);
        c.classList.toggle('off');
        refilter();
      };
      chips.appendChild(c);
    }

    const onair = document.getElementById('onair');
    onair.classList.toggle('on', s.streaming);
    onair.textContent = s.streaming ? '● En directo' + (s.service ? ` · ${s.service}` : '') :
      (s.live_platforms.length ? `En vivo en ${s.live_platforms.map(p => PLATFORMS[p]?.name || p).join(', ')}` : 'Fuera de directo');

    const banner = document.getElementById('banner');
    banner.textContent = '';
    banner.classList.toggle('show', !!s.multistream);
    if (s.multistream) {
      banner.append('Multistream detectado');
      for (const p of s.live_platforms) banner.appendChild(iconEl(p));
    }

    document.getElementById('notice').textContent = (s.errors || []).join(' · ');

    if (!s.sources.length && !list.querySelector('.msg')) {
      list.innerHTML = '<div class="empty">No hay chats configurados.<br>En OBS ve a <code>Herramientas → Scripts → obs_multichat.py</code> y añade tus canales, por ejemplo <code>twitch:micanal</code>, <code>youtube:@micanal</code> o <code>kick:micanal</code>.</div>';
    } else if (s.sources.length && !list.querySelector('.msg') && !list.querySelector('.empty')) {
      list.innerHTML = '<div class="empty">Esperando mensajes…</div>';
    }
  }

  connectEvents({
    onState: renderState,
    onHistory: h => { list.textContent = ''; h.forEach(add); renderState(state); },
    onMessage: add,
    onClear: () => { list.textContent = ''; renderState(state); },
    onStatus: ok => document.getElementById('offline').classList.toggle('show', !ok),
  });

  document.getElementById('btnBigger').onclick = () => { fs = Math.min(fs + 1, 24); store('mc.fs', fs); applyFs(); };
  document.getElementById('btnSmaller').onclick = () => { fs = Math.max(fs - 1, 10); store('mc.fs', fs); applyFs(); };
  document.getElementById('btnTime').onclick = () => { showTime = !showTime; store('mc.time', showTime); document.body.classList.toggle('notime', !showTime); };
  document.getElementById('btnClear').onclick = () => fetch('/api/clear', { method: 'POST' });
  document.getElementById('btnRefresh').onclick = () => fetch('/api/refresh', { method: 'POST' });
  document.getElementById('btnOverlay').onclick = async e => {
    const url = location.origin + '/overlay';
    try { await navigator.clipboard.writeText(url); e.target.textContent = '✓'; }
    catch { prompt('URL del overlay (fuente Navegador):', url); }
    setTimeout(() => e.target.textContent = '⧉', 1200);
  };
</script>
</body>
</html>
