name: Compilar plugin

# Compila el plugin para OBS 33 en Windows (Visual Studio), macOS (Xcode, binario universal) y
# Linux (Ubuntu 24.04 con el OBS del PPA oficial) y deja los paquetes como artefactos. release.yml lo reutiliza para publicar una versión.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  # Parsers de Twitch, YouTube y Kick (solo Qt Core, sin OBS ni red).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Qt 6
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev ninja-build
      - name: manifest.json tiene la versión de buildspec.json
        run: |
          python3 -c "import json,sys; b=json.load(open('buildspec.json'))['version']; m=json.load(open('data/manifest.json'))['version']; sys.exit(0 if b==m else f'manifest.json dice {m} y buildspec.json {b}')"
      - name: Compilar y ejecutar las pruebas
        run: |
          cmake -S tests -B build_tests -G Ninja
          cmake --build build_tests
          ctest --test-dir build_tests --output-on-failure

  macos:
    # OBS 33 exige el SDK de macOS 26.5 (Xcode 26.5) para compilar libobs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          test -n "$xcode" || { echo "No hay Xcode 26 en este runner"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcrun --sdk macosx --show-sdk-version
      - name: Versión
        id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Configurar (descarga OBS 33, obs-deps y Qt)
        run: |
          xcodebuild -version
          cmake --preset macos-ci
      - name: Compilar con Xcode
        run: |
          set -o pipefail
          cmake --build --preset macos-ci 2>&1 | tee build.log || { echo "--- errores"; grep -E "error:|warning:" build.log | sort -u; exit 1; }
      - name: Empaquetar
        run: |
          plugin="$(find build_macos -type d -name 'obs-multichat.plugin' -path '*RelWithDebInfo*' | head -1)"
          echo "plugin: $plugin"
          test -n "$plugin"
          codesign --verify --deep --strict --verbose=2 "$plugin"
          lipo -archs "$plugin/Contents/MacOS/obs-multichat"
          for file in locale/es-ES.ini locale/en-US.ini overlay/index.html overlay/viewers.html overlay/clock.html overlay/styles.css overlay/icons.js manifest.json; do
            test -f "$plugin/Contents/Resources/$file" || { echo "Falta $file"; exit 1; }
          done
          mkdir -p dist
          ditto -c -k --keepParent "$plugin" "dist/obs-multichat-${{ steps.version.outputs.v }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: dist/*

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: '"v=$((Get-Content buildspec.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - name: Configurar (descarga OBS 33, obs-deps y Qt)
        run: cmake --preset windows-ci-x64
      - name: Compilar con Visual Studio
        run: cmake --build --preset windows-ci-x64
      - name: Empaquetar
        run: |
          cmake --install build_x64 --prefix release --config RelWithDebInfo
          # Con la forma de OBS 33 (C:\ProgramData\obs-studio\plugins\obs-multichat): el .dll en
          # la carpeta del plugin y los datos en su carpeta data.
          $built = "release/obs-multichat"
          New-Item -ItemType Directory -Force package/obs-multichat | Out-Null
          Copy-Item "$built/bin/64bit/obs-multichat.dll" package/obs-multichat/
          Copy-Item "$built/data" package/obs-multichat/data -Recurse
          Get-ChildItem -Recurse package | Select-Object -ExpandProperty FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path package/* -DestinationPath "dist/obs-multichat-${{ steps.version.outputs.v }}-windows-x64.zip"
      - name: El zip trae la forma de OBS 33
        run: |
          $zip = Get-Item "dist/obs-multichat-*-windows-x64.zip"
          $dir = Join-Path $env:RUNNER_TEMP $zip.BaseName
          Expand-Archive $zip.FullName -DestinationPath $dir
          foreach ($file in 'obs-multichat\obs-multichat.dll', 'obs-multichat\data\manifest.json',
                            'obs-multichat\data\overlay\index.html', 'obs-multichat\data\overlay\viewers.html',
                            'obs-multichat\data\overlay\icons.js', 'obs-multichat\data\overlay\clock.html',
                            'obs-multichat\data\overlay\styles.css',
                            'obs-multichat\data\locale\es-ES.ini', 'obs-multichat\data\locale\en-US.ini') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file en el zip" }
          }
          # El plugin solo debe depender de OBS, Qt y del sistema (WinHTTP).
          $dumpbin = Get-ChildItem -Recurse "${env:ProgramFiles}\Microsoft Visual Studio" -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          & $dumpbin.FullName /dependents (Join-Path $dir 'obs-multichat\obs-multichat.dll')
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: OBS (PPA oficial), Qt 6 y libcurl
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends obs-studio qt6-base-dev qt6-base-private-dev \
            libcurl4-openssl-dev libsimde-dev libgles2-mesa-dev ninja-build
          dpkg -s obs-studio | grep '^Version'
      - name: Configurar
        run: cmake --preset ubuntu-ci-x86_64
      - name: Compilar
        run: cmake --build --preset ubuntu-ci-x86_64
      - name: Empaquetar
        run: |
          cmake --install build_x86_64 --prefix release
          # Con la forma de la carpeta de plugins del usuario
          # (~/.config/obs-studio/plugins/obs-multichat): el .so en bin/64bit y los datos en data.
          mkdir -p package/obs-multichat/bin/64bit
          cp -L release/lib/*/obs-plugins/obs-multichat.so package/obs-multichat/bin/64bit/
          strip --strip-debug package/obs-multichat/bin/64bit/obs-multichat.so
          cp -r release/share/obs/obs-plugins/obs-multichat package/obs-multichat/data
          for file in bin/64bit/obs-multichat.so data/manifest.json data/locale/es-ES.ini data/locale/en-US.ini \
                      data/overlay/index.html data/overlay/viewers.html data/overlay/clock.html \
                      data/overlay/styles.css data/overlay/icons.js; do
            test -f "package/obs-multichat/$file" || { echo "Falta $file"; exit 1; }
          done
          # El plugin solo debe depender de OBS, Qt, libcurl y el sistema.
          ldd package/obs-multichat/bin/64bit/obs-multichat.so
          mkdir -p dist
          tar -czf "dist/obs-multichat-${{ steps.version.outputs.v }}-linux-x86_64.tar.gz" -C package obs-multichat
          tar -tzf dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: dist/*
