name: Publicar versión

# Para publicar: sube "version" en buildspec.json, haz commit y empuja un tag con esa versión:
#   git tag v2.0.0 && git push origin v2.0.0
# o lanza este flujo a mano (Actions → Publicar versión → Run workflow) en la rama que quieras
# publicar: crea el tag v<version de buildspec.json> sobre ese commit.
# Compila el plugin y adjunta los zips de Windows y macOS a la Release del tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: El tag coincide con buildspec.json
        id: tag
        run: |
          v="v$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "El tag es $GITHUB_REF_NAME pero buildspec.json dice $v"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "Ya existe el tag $v: sube la versión en buildspec.json"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="${{ steps.tag.outputs.name }}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Multichat $tag" --generate-notes
