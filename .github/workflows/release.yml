name: Publicar versión

# Publica una Release con los zips de Windows y macOS, el .tar.gz de Linux y su SHA256SUMS. Se lanza:
#   - solo, al subir a main un cambio de "version" en buildspec.json (si ese tag aún no existe);
#   - al empujar un tag v<version>:  git tag v2.0.2 && git push origin v2.0.2
#     (v<version>-beta.1, -rc.1… sale como pre-release: no queda como "Latest" ni la ve el actualizador)
#   - a mano: Actions → Publicar versión → Run workflow (sobre la rama elegida).
# En los tres casos el tag es v<version de buildspec.json>; si ya existe, no se publica nada.
on:
  push:
    branches: [main]
    paths: [buildspec.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      publish: ${{ steps.tag.outputs.publish }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Versión y tag
        id: tag
        run: |
          v="v$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")"
          name="$v"
          prerelease=false
          publish=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # v<version> publishes a release; v<version>-<suffix> (e.g. -beta.1, -rc.1) a pre-release.
            case "$GITHUB_REF_NAME" in
              "$v") ;;
              "$v"-?*) name="$GITHUB_REF_NAME"; prerelease=true ;;
              *) echo "El tag es $GITHUB_REF_NAME pero buildspec.json dice $v"; exit 1 ;;
            esac
          elif git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "Ya existe el tag $v: no se publica nada (sube la versión en buildspec.json)."
            publish=false
          fi
          { echo "name=$name"; echo "prerelease=$prerelease"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        # El actualizador del plugin comprueba la descarga con el "digest" del asset que da la API
        # de GitHub y, si falta, con este SHA256SUMS ("<hash>  <archivo>" por línea).
        working-directory: dist
        run: |
          sha256sum -- obs-multichat-* > SHA256SUMS
          cat SHA256SUMS
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          ls -la dist
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "AC Multichat $TAG" --generate-notes "${flags[@]}"
      - name: Actualizar alejoxcode
        # The site shows the latest stable release, so a pre-release leaves it alone.
        if: needs.prepare.outputs.prerelease != 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$VERCEL_DEPLOY_HOOK" ] || { echo "Sin VERCEL_DEPLOY_HOOK: se omite"; exit 0; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
